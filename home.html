<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Работа в Кызылорде — Jumys.online | Вакансиялар мен жұмыс</title>
  <meta name="description"
    content="Jumys.online — Кызылордадағы ең жаңа бос жұмыс орындары мен вакансиялар порталы. Поиск работы и сотрудников в Кызылорде за 5 минут.">
  <meta name="keywords"
    content="жұмыс кызылорда, работа кызылорда, вакансии кызылорда, jumys online, работа для студентов кызылорда">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap"
    rel="stylesheet">
  <meta property="og:title" content="Jumys.online — Қызылордадағы жұмыс">
  <meta property="og:description" content="Жұмыс немесе қызметкерді 5 минутта табыңыз. Жылдам әрі ыңғайлы.">
  <meta property="og:image"
    content="https://raw.githubusercontent.com/spiritz-site/Jumys.online/main/poster%2016%209.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/spiritz-site/Jumys.online/main/favicon.png">

  <style>
    /* ===== BASE ===== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4f6f9;
      background-image: url("home-background.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #334155;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      width: 8px;
    }

    body::-webkit-scrollbar-track {
      background: transparent;
    }

    body::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }

    :root {
      --pad: 20px;
      --shadow: 0px 5px 20px rgba(0, 0, 0, 0.05);
      --border: 1px solid rgba(255, 255, 255, 0.5);
      --radius: 20px;
      --primary: #00205b;
      /* RESTORED FIRM DARK BLUE */
      --vip-gold: #FFD700;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px var(--pad);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* LANG SWITCHER */
    .header-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: -10px;
    }

    .lang-switch {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      padding: 4px;
      border-radius: 12px;
      display: flex;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .lang-btn {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
    }

    .lang-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* SEARCH */
    .search-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search {
      position: relative;
      width: 100%;
    }

    .search-bg {
      height: 48px;
      width: 100%;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .searchbar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    .searchbar input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font-size: 15px;
      color: #172343;
      font-family: inherit;
      font-weight: 500;
    }

    .question {
      font-size: 24px;
      font-weight: 800;
      color: #172343;
      letter-spacing: -0.5px;
    }

    /* CATEGORIES */
    .categories {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .category {
      flex: 1;
      position: relative;
      border-radius: var(--radius);
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 10/6 !important;
      transition: transform 0.2s;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .category.is-active {
      transform: scale(1.02);
      z-index: 2;
      box-shadow: 0 15px 30px rgba(0, 80, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .category__bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #0069ff 0%, #00afff 100%);
      opacity: 0.85;
    }

    .category--worker .category__bg {
      transform: rotate(180deg);
    }

    .category__content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .category__title {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .category__subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    .category__count {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      align-self: flex-start;
    }

    /* ADD BANNER */
    .add-action-box {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      border: 1px dashed var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .add-action-box:active {
      transform: scale(0.98);
    }

    .add-action-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }

    .add-action-sub {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .add-action-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    /* SECTION HEADER & TAG FILTER */
    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #172343;
      line-height: 1.2;
    }

    .show-all {
      flex-shrink: 0;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 99px;
      border: var(--border);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ACTIVE TAG PANEL */
    .active-tag-panel {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: -10px;
      animation: fadeIn 0.3s ease;
    }

    .active-tag-panel.visible {
      display: flex;
    }

    .active-tag-chip {
      background: var(--primary);
      color: #fff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 32, 91, 0.2);
    }

    .close-tag-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      opacity: 0.8;
      transition: 0.2s;
    }

    .close-tag-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== NEW CARD LAYOUT with Glassmorphism ========== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
      padding-bottom: 40px;
    }

    .card {
      /* GLASSMORPHISM */
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);

      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      position: relative;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.85);
      /* Lighten on hover */
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border-color: rgba(255, 255, 255, 0.6);
    }

    /* VIP */
    .card--vip {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(255, 253, 235, 0.8) 100%);
      border: 1px solid rgba(255, 229, 143, 0.6);
    }

    /* Fixed Badge Position */
    .vip-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--vip-gold);
      color: #3d2e00;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 5px 10px;
      border-radius: 0 0 0 12px;
      z-index: 10;
      pointer-events: none;
    }

    /* HEADER */
    .card__header {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .card__icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: transparent;
      /* REMOVED BACKGROUND */
    }

    .card__meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 2px;
    }

    .card__title {
      font-size: 16px;
      font-weight: 700;
      color: #172343;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card__company {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card__salary-pill {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: #009945;
      background: rgba(230, 250, 235, 0.8);
      /* Slight transparent pill */
      padding: 6px 8px;
      border-radius: 8px;
      white-space: nowrap;
      margin-left: 2px;
      margin-top: 2px;
    }

    .card--vip .card__header {
      padding-right: 28px;
    }

    /* BODY */
    .card__body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card__desc {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* FOOTER */
    .card__footer {
      display: flex;
      align-items: center;
      /* Center Vertically if tags wrap to 2 lines */
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 4px;
    }

    /* --- FIXED TAGS WRAPPING --- */
    .card__tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      /* WRAP TAGS */
      height: auto;
      /* AUTO HEIGHT */
      align-items: center;
      flex: 1;
      /* Take all space left of button */
    }

    .tag {
      height: auto;
      /* Allow growth */
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      white-space: normal;
      /* ALLOW TEXT WRAP */
      word-break: break-word;
      /* BREAK LONG WORDS */
      max-width: 100%;
      cursor: pointer;
      line-height: 1.2;
    }

    .tag:hover {
      transform: translateY(-1px);
      opacity: 0.8;
    }

    .tag--cyan {
      background: #E0F2FE;
      color: #0284C7;
    }

    .tag--pink {
      background: #FFE4E6;
      color: #E11D48;
    }

    .tag--green {
      background: #DCFCE7;
      color: #166534;
    }

    .tag--purple {
      background: #F3E8FF;
      color: #7E22CE;
    }

    .tag--orange {
      background: #FFEDD5;
      color: #C2410C;
    }

    .tag--blue {
      background: #DBEAFE;
      color: #1E40AF;
    }

    .tag--yellow {
      background: #FEF9C3;
      color: #A16207;
    }

    .tag--gray {
      background: #F1F5F9;
      color: #475569;
    }

    .card__btn {
      flex-shrink: 0;
      height: 36px;
      padding: 0 16px;
      align-self: flex-end;
      /* Align button to bottom if tags grow tall? or center? Center is safer for balance. */
      /* Actually center is better if tags are 2 lines. But let's try center. */
      border-radius: 10px;
      background: var(--primary);
      /* Uses #00205b */
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0, 32, 91, 0.25);
      /* Added glow for firm look */
    }

    .card__btn:hover {
      background: #001640;
      box-shadow: 0 6px 14px rgba(0, 32, 91, 0.35);
    }

    .card__btn:active {
      transform: scale(0.96);
    }

    /* SKELETON */
    .skeleton-box {
      background: rgba(0, 0, 0, 0.06);
      border-radius: 6px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.6;
      }
    }

    /* MEDIA QUERIES */
    @media (min-width: 768px) {
      .question {
        font-size: 32px;
        text-align: center;
        margin-bottom: 10px;
      }

      .search-container {
        max-width: 800px;
        margin: 0 auto;
      }

      .categories {
        max-width: 800px;
        margin: 0 auto;
        gap: 24px;
      }

      .category {
        aspect-ratio: 15/5;
      }

      .add-action-box {
        max-width: 800px;
        margin: 0 auto;
      }

      .section-row,
      .active-tag-panel {
        max-width: 1200px;
        margin: 20px auto 10px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
    }

    @media (min-width: 1024px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .question {
        font-size: 40px;
      }
    }

    @media (max-width: 767px) {
      .app {
        max-width: 100%;
        background: transparent;
      }

      .content {
        padding: 20px 16px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .category {
        aspect-ratio: 167/197;
      }
    }

    /* SEARCH HEADER FIX */
    .search-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 12px;
    }

    .question {
      margin-bottom: 0 !important;
      line-height: 1;
    }

    .lang-switch {
      margin-left: 10px;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .search-header {
        justify-content: center;
        position: relative;
      }

      .search-header .lang-switch {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="content">

      <!-- HEADER SEARCH -->
      <div class="search-container">
        <div class="search-header">
          <div class="question" data-i18n="question">Не іздеп отырсыз?</div>
          <div class="lang-switch">
            <div class="lang-btn" onclick="changeLang('kz')" id="btnKz">KZ</div>
            <div class="lang-btn" onclick="changeLang('ru')" id="btnRu">RU</div>
          </div>
        </div>
        <div class="search">
          <div class="search-bg"></div>
          <div class="searchbar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="q" placeholder="..." autocomplete="off">
          </div>
        </div>
      </div>

      <!-- CATEGORIES -->
      <div class="categories">
        <div class="category category--work is-active" id="catWork" data-type="vacancy">
          <div class="category__bg"></div>
          <div class="category__content">
            <div class="cat-top">
              <div class="category__title" data-i18n="cat_work">Жұмыс</div>
              <div class="category__subtitle" data-i18n="cat_work_sub">Вакансиялар</div>
            </div>
            <div class="category__count" id="countVac">...</div>
          </div>
        </div>
        <div class="category category--worker" id="catWorker" data-type="profile">
          <div class="category__bg"></div>
          <div class="category__content">
            <div class="cat-top">
              <div class="category__title" data-i18n="cat_worker">Жұмысшы</div>
              <div class="category__subtitle" data-i18n="cat_worker_sub">Анкеталар</div>
            </div>
            <div class="category__count" id="countProf">...</div>
          </div>
        </div>
      </div>

      <!-- BANNER -->
      <a href="https://t.me/jumys_online_bot" target="_blank" class="add-action-box">
        <div class="add-action-text">
          <div class="add-action-title" data-i18n="add_title">Өз хабарландыруыңды қос</div>
          <div class="add-action-sub" data-i18n="add_sub">Жұмыс немесе жұмысшы іздеу 650₸</div>
        </div>
        <div class="add-action-icon">+</div>
      </a>

      <!-- ACTIVE TAGS -->
      <div id="activeTagPanel" class="active-tag-panel">
        <div class="active-tag-chip">
          <span id="activeTagText">#tag</span>
          <div class="close-tag-btn" onclick="clearTag()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>
      </div>

      <!-- SECTION TITLE -->
      <div class="section-row">
        <div class="section-title" id="sectionTitle" data-i18n="section_title_vac">Ұсынылған вакансиялар</div>
        <div class="show-all" id="showAll" data-i18n="show_all">Бәрі</div>
      </div>

      <!-- CARDS LIST -->
      <div class="cards" id="cards">
        <!-- INITIAL SKELETONS -->
        <div class="card">
          <div class="card__header">
            <div class="skeleton-box" style="width:44px; height:44px; border-radius:12px; flex-shrink:0;"></div>
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
              <div class="skeleton-box" style="height:14px; width:70%;"></div>
              <div class="skeleton-box" style="height:12px; width:40%;"></div>
            </div>
            <div class="skeleton-box" style="width:60px; height:24px; border-radius:8px;"></div>
          </div>
          <div class="card__body" style="gap:8px; margin-top:12px;">
            <div class="skeleton-box" style="height:12px; width:100%;"></div>
            <div class="skeleton-box" style="height:12px; width:90%;"></div>
            <div class="skeleton-box" style="height:12px; width:60%;"></div>
          </div>
          <div class="card__footer">
            <div style="display:flex; gap:6px;">
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
            </div>
            <div class="skeleton-box" style="width:70px; height:36px; border-radius:10px;"></div>
          </div>
        </div>
        <div class="card">
          <div class="card__header">
            <div class="skeleton-box" style="width:44px; height:44px; border-radius:12px; flex-shrink:0;"></div>
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
              <div class="skeleton-box" style="height:14px; width:70%;"></div>
              <div class="skeleton-box" style="height:12px; width:40%;"></div>
            </div>
            <div class="skeleton-box" style="width:60px; height:24px; border-radius:8px;"></div>
          </div>
          <div class="card__body" style="gap:8px; margin-top:12px;">
            <div class="skeleton-box" style="height:12px; width:100%;"></div>
            <div class="skeleton-box" style="height:12px; width:90%;"></div>
            <div class="skeleton-box" style="height:12px; width:60%;"></div>
          </div>
          <div class="card__footer">
            <div style="display:flex; gap:6px;">
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
            </div>
            <div class="skeleton-box" style="width:70px; height:36px; border-radius:10px;"></div>
          </div>
        </div>
        <div class="card">
          <div class="card__header">
            <div class="skeleton-box" style="width:44px; height:44px; border-radius:12px; flex-shrink:0;"></div>
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
              <div class="skeleton-box" style="height:14px; width:70%;"></div>
              <div class="skeleton-box" style="height:12px; width:40%;"></div>
            </div>
            <div class="skeleton-box" style="width:60px; height:24px; border-radius:8px;"></div>
          </div>
          <div class="card__body" style="gap:8px; margin-top:12px;">
            <div class="skeleton-box" style="height:12px; width:100%;"></div>
            <div class="skeleton-box" style="height:12px; width:90%;"></div>
            <div class="skeleton-box" style="height:12px; width:60%;"></div>
          </div>
          <div class="card__footer">
            <div style="display:flex; gap:6px;">
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
              <div class="skeleton-box" style="width:40px; height:26px; border-radius:6px;"></div>
            </div>
            <div class="skeleton-box" style="width:70px; height:36px; border-radius:10px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyf9kKiLvAnazrc_3X3riq5QSDaex8Rcrtk_VwxPA6D6jNZCCNAR9O8ibCz9_K1ojPTVA/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const urlLang = urlParams.get('lang');
    const currentLang = (urlLang === "ru") ? "ru" : (localStorage.getItem("lang") === "ru" ? "ru" : "kz");

    function updateLangButtons() {
      document.getElementById("btnKz").classList.toggle("active", currentLang === "kz");
      document.getElementById("btnRu").classList.toggle("active", currentLang === "ru");
    }
    updateLangButtons();

    function changeLang(lang) {
      if (lang === currentLang) return;
      localStorage.setItem("lang", lang);
      const url = new URL(window.location);
      url.searchParams.set("lang", lang);
      window.location.href = url.toString();
    }

    const translations = {
      kz: {
        question: "Не іздеп отырсыз?", placeholder: "Іздеу", cat_work: "Жұмыс", cat_work_sub: "Вакансиялар қарау", cat_worker: "Жұмысшы", cat_worker_sub: "Анкеталар қарау", section_title_vac: "Ұсынылған вакансиялар", section_title_prof: "Ұсынылған анкеталар", show_all: "Бәрі", not_found: "Ештеңе табылмады :(", open_btn: "Ашу", vac_count: " вакансия", prof_count: " анкета",
        add_title: "Өз хабарландыруыңды қос", add_sub: "Жұмыс немесе жұмысшы іздеу 650₸",
        reload: "Жаңарту"
      },
      ru: {
        question: "Что вы ищете?", placeholder: "Поиск", cat_work: "Работа", cat_work_sub: "Смотреть вакансии", cat_worker: "Работник", cat_worker_sub: "Смотреть анкеты", section_title_vac: "Рекомендуемые вакансии", section_title_prof: "Рекомендуемые анкеты", show_all: "Все", not_found: "Ничего не найдено :(", open_btn: "Открыть", vac_count: " вакансий", prof_count: " анкет",
        add_title: "Добавить своё объявление", add_sub: "Поиск работы или сотрудников 650₸",
        reload: "Обновить"
      }
    };

    function applyLang() {
      const t = translations[currentLang];
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
      document.getElementById("q").placeholder = t.placeholder;
    }
    applyLang();

    // --- STATE MANAGEMENT ---
    const state = { type: "vacancy", q: "", tag: null };

    // --- USER CONTEXT ---
    try {
      const userStr = localStorage.getItem('user');
      if (userStr) {
        const user = JSON.parse(userStr);
        if (user.role === 'client') {
          state.type = 'profile';
          document.getElementById("catWorker").classList.add("is-active");
          document.getElementById("catWork").classList.remove("is-active");
        } else {
          // Master -> vacancy (default)
          document.getElementById("catWork").classList.add("is-active");
          document.getElementById("catWorker").classList.remove("is-active");
        }

        // Update Greeting
        const questionEl = document.querySelector('.question');
        if (questionEl) {
          const greeting = user.name ? `${user.name}, ` : '';
          const isRu = currentLang === 'ru';
          // Master looks for Work (vacancy), Client looks for Worker (profile)
          let suffix = "";
          if (user.role === 'client') {
            suffix = isRu ? "найдите своего мастера" : "өз шеберіңізді табыңыз"; // customized nicely
          } else {
            suffix = isRu ? "найдите работу" : "жұмыс табыңыз";
          }
          questionEl.textContent = greeting + suffix;
          questionEl.removeAttribute("data-i18n"); // Prevent overwrite by applyLang for now
        }
      }
    } catch (e) { console.error("User Context Error", e); }
    let items = [];

    function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }

    function tagClass(tone) {
      const map = { cyan: "tag--cyan", pink: "tag--pink", green: "tag--green", purple: "tag--purple", orange: "tag--orange", blue: "tag--blue", yellow: "tag--yellow" };
      return "tag " + (map[(tone || "").toLowerCase()] || "tag--gray");
    }

    // --- RENDER CARD (UPDATED) ---
    function renderCard(x) {
      const t = translations[currentLang];

      const tagsHtml = (x.tags || []).map(k =>
        `<span class="${tagClass(k.tone)}" onclick="event.preventDefault(); filterByTag('${escapeHtml(k.text)}')" title="Фильтр">${escapeHtml(k.text)}</span>`
      ).join("");

      const isVip = x.is_vip == "1";
      const iconSrc = x.icon || 'https://via.placeholder.com/44';

      return `
        <article class="card ${isVip ? 'card--vip' : ''}">
          ${isVip ? `<div class="vip-badge">TOP</div>` : ''}
          
          <div class="card__header">
            <img class="card__icon" src="${iconSrc}" alt="Logo" onerror="this.src='https://via.placeholder.com/44'">
            <div class="card__meta">
              <div class="card__title" title="${escapeHtml(x.title)}">${escapeHtml(x.title)}</div>
              <div class="card__company" title="${escapeHtml(x.subtitle)}">${escapeHtml(x.subtitle)}</div>
            </div>
            ${x.salary ? `<div class="card__salary-pill">${escapeHtml(x.salary)}</div>` : ''}
          </div>

          <div class="card__body">
            <div class="card__desc">${escapeHtml(x.desc)}</div>
          </div>

          <div class="card__footer">
            <div class="card__tags">${tagsHtml}</div>
            <a class="card__btn" href="card.html?id=${encodeURIComponent(x.id)}&lang=${currentLang}">
              ${t.open_btn}
            </a>
          </div>
        </article>
      `;
    }

    // --- FILTER LOGIC ---
    function filterByTag(tagName) {
      state.tag = tagName;
      state.q = "";
      document.getElementById("q").value = "";
      document.getElementById("activeTagText").textContent = "#" + tagName;
      document.getElementById("activeTagPanel").classList.add("visible");
      draw();
    }

    function clearTag() {
      state.tag = null;
      document.getElementById("activeTagPanel").classList.remove("visible");
      draw();
    }

    // --- SEARCH & DRAW ---
    function draw() {
      const q = state.q.trim().toLowerCase();
,
, дддддд
      let list = items.filter(x => {
        if (x.type !== state.type) return false;
        if (state.tag) {
          const hasTag = (x.tags || []).some(t => t.text === state.tag);
          if (!hasTag) return false;
        }
        if (!q) return true;

        const tagString = (x.tags || []).map(t => t.text).join(" ");
        const hashtagString = (x.hashtags || []).join(" ");
        const fullText = (x.title + " " + x.subtitle + " " + x.desc + " " + tagString + " " + hashtagString).toLowerCase();
        return fullText.includes(q);
      });

      list.sort((a, b) => (b.is_vip || 0) - (a.is_vip || 0));

      const container = document.getElementById("cards");
      const t = translations[currentLang];

      if (list.length === 0 && items.length > 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#64748B;">${t.not_found}</div>`;
      } else if (items.length > 0) {
        container.innerHTML = list.map(renderCard).join("");
      }

      document.getElementById("countVac").textContent = items.filter(x => x.type === "vacancy").length + t.vac_count;
      document.getElementById("countProf").textContent = items.filter(x => x.type === "profile").length + t.prof_count;
      document.getElementById("sectionTitle").textContent = state.type === "vacancy" ? t.section_title_vac : t.section_title_prof;
    }

    async function loadFromSheets() {
      try {
        const res = await fetch(API_URL);
        const raw = await res.json();
        items = raw.map(x => ({
          ...x,
          type: (x.type || "vacancy").toLowerCase(),
          is_vip: x.is_vip || 0,
          tags: [
            x.tag1 ? { text: String(x.tag1), tone: x.tag1_tone } : null,
            x.tag2 ? { text: String(x.tag2), tone: x.tag2_tone } : null
          ].filter(Boolean),
          hashtags: x.hashtags ? String(x.hashtags).split(',').map(h => h.trim()) : []
        }));
        draw();
      } catch (e) {
        console.error(e);
        const t = translations[currentLang];
        document.getElementById("cards").innerHTML = `<div style="text-align:center; padding:40px; color:#EF4444; grid-column:1/-1;">Error loading data <br><button onclick="loadFromSheets()" style="margin-top:10px; padding:8px 16px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer">${t.reload}</button></div>`;
      }
    }

    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; draw(); });

    document.getElementById("catWork").onclick = () => {
      state.type = "vacancy"; clearTag();
      document.getElementById("catWork").classList.add("is-active");
      document.getElementById("catWorker").classList.remove("is-active");
      draw();
    };

    document.getElementById("catWorker").onclick = () => {
      state.type = "profile"; clearTag();
      document.getElementById("catWorker").classList.add("is-active");
      document.getElementById("catWork").classList.remove("is-active");
      draw();
    };

    document.getElementById("showAll").onclick = () => {
      state.q = "";
      document.getElementById("q").value = "";
      clearTag();
    };

    loadFromSheets();
  </script>
</body>

</html>
