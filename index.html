<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheber.kz | Жеке үйлерге кызмет корсету</title>
  <meta name="description" content="Sheber.kz — Қазақстан бойынша жеке үйлерге кызмет корсету порталы.">
  <meta name="keywords" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <meta property="og:title" content="Sheber.kz — Қазақстан бойынша жеке үйлерге кызмет корсету">
  <meta property="og:description" content="Шеберді 5 минутта табыңыз. Жылдам әрі ыңғайлы.">
  <meta property="og:image"
    content="https://raw.githubusercontent.com/spiritz-site/Jumys.online/main/poster%2016%209.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/spiritz-site/Jumys.online/main/favicon.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    .start-1 {
      min-height: 100vh;
      position: relative;
      background-image: url("background-desktop.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .start-1 {
        background-image: url("background-mobile.png");
      }
    }

    .start-1::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.20));
      z-index: 0;
      pointer-events: none;
    }

    .start-1>* {
      position: relative;
      z-index: 1;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }

    .lang-rect {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.20);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
      font-family: Montserrat, sans-serif;
      color: #fff;
      user-select: none;
    }

    .lang-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      line-height: 1;
      opacity: 0.9;
      cursor: pointer;
    }

    .lang-pill.active {
      border: 1px solid rgba(255, 255, 255, 0.9);
      opacity: 1;
    }

    .hero {
      max-width: 560px;
      margin-top: 50px;
      font-family: Montserrat, sans-serif;
      color: #fff;
    }

    @media (max-width: 768px) {
      .hero {
        margin-top: 200px;
      }
    }

    .jumys-online {
      font-size: 44px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 10px;
    }

    .div {
      font-size: 16px;
      line-height: 1.35;
      opacity: 0.95;
      max-width: 420px;
    }

    .button-continue {
      display: flex;
      justify-content: center;
      padding-bottom: 16px;
    }

    .continue {
      width: min(640px, 100%);
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      text-align: center;
      padding: 18px 22px;
      border-radius: 18px;
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background 0.1s;
      text-decoration: none;
      display: block;
    }

    .continue:active {
      transform: scale(0.98);
      background: #fff;
    }

    @media (max-width: 420px) {
      .jumys-online {
        font-size: 36px;
      }

      .start-1 {
        padding: 22px 18px;
      }

      .continue {
        width: min(520px, 100%);
        padding: 16px 18px;
        font-size: 16px;
      }
    }

    @media (min-width: 769px) {
      .hero {
        margin-top: 300px !important;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
        align-self: center;
      }

      .jumys-online {
        font-size: 90px;
      }

      .div {
        font-size: 25px;
        line-height: 1.5;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .continue {
        width: 720px;
        max-width: 80vw;
        padding: 22px 28px;
        font-size: 20px;
        border-radius: 22px;
      }
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* Modal Styles */
    /* Hide Spinners */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #fff;
      width: min(400px, 90%);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.3s;
      position: relative;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      padding: 5px;
    }

    .modal-title {
      font-family: Montserrat, sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #333;
    }

    .modal-desc {
      font-family: Montserrat, sans-serif;
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-family: Montserrat, sans-serif;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .modal-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-family: Montserrat, sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #333;
    }

    .modal-btn {
      width: 100%;
      background: #333;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-family: Montserrat, sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn:hover {
      background: #000;
    }

    .modal-step {
      display: none;
    }

    .modal-step.active {
      display: block;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .resend-link {
      display: inline-block;
      margin-top: 15px;
      font-family: Montserrat, sans-serif;
      font-size: 13px;
      color: #666;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="start-1">

    <div class="lang-switcher">
      <div class="lang-rect">
        <div class="lang-pill active" data-lang="kz">Қаз</div>
        <div class="lang-pill" data-lang="ru">Рус</div>
      </div>
    </div>

    <div class="hero">
      <div class="jumys-online" data-i18n="title">Sheber.kz</div>
      <div class="div" data-i18n="desc">
        Қазақстанға арналған шеберлер алаңы:
        <br />
        тапсырыс беруші мен шеберді тез
        <br />
        байланыстырамыз.
      </div>
    </div>

    <div class="button-continue">
      <a href="home.html" id="startLink" class="continue" data-i18n="start_btn">Бастау</a>
    </div>

  </div>

  <!-- SMS Modal -->
  <div class="modal-overlay" id="smsModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>

      <!-- Step 1: Phone -->
      <div class="modal-step active" id="stepPhone">
        <div class="modal-title" data-i18n="modal_phone_title">Войти</div>
        <div class="modal-desc" data-i18n="modal_phone_desc">Введите номер телефона, чтобы войти или зарегистрироваться
        </div>

        <div class="input-group">
          <label class="input-label" data-i18n="lbl_phone">Телефон</label>
          <input type="tel" class="modal-input" placeholder="+7 (___) ___-__-__" value="+7" id="phoneInput">
        </div>

        <button class="modal-btn" onclick="sendCode()" data-i18n="btn_get_code">Получить код</button>
      </div>

      <!-- Step 2: Code -->
      <div class="modal-step" id="stepCode">
        <div class="modal-title" data-i18n="modal_code_title">Подтверждение</div>
        <div class="modal-desc">
          <span data-i18n="modal_code_desc">Мы отправили код на</span> <br>
          <strong id="displayPhone"></strong>
        </div>

        <div class="input-group">
          <label class="input-label" data-i18n="lbl_code">Код из СМС</label>
          <input type="number" class="modal-input" placeholder="Введите код" id="codeInput" maxlength="4">
        </div>

        <button class="modal-btn" onclick="verifyCode()" data-i18n="btn_confirm">Подтвердить</button>
        <div class="resend-link" onclick="sendCode()" data-i18n="btn_resend">Отправить код снова</div>
      </div>

    </div>
  </div>

  <script>
    const translations = {
      kz: {
        title: "Sheber.kz",
        desc: `Қазақстанға арналған шеберлер алаңы: <br/>
               тапсырыс беруші мен шеберді тез<br/>
               байланыстырамыз.`,
        start_btn: "Бастау",
        modal_phone_title: "Кіру",
        modal_phone_desc: "Кіру немесе тіркелу үшін телефон нөміріңізді енгізіңіз",
        lbl_phone: "Телефон",
        btn_get_code: "Код алу",
        modal_code_title: "Растау",
        modal_code_desc: "Код мына нөмірге жіберілді:",
        lbl_code: "СМС коды",
        btn_confirm: "Растау",
        btn_resend: "Кодты қайта жіберу"
      },
      ru: {
        title: "Sheber.kz",
        desc: `Платформа мастеров Казахстана: <br/>
               Мы быстро связываем заказчика и мастера.`,
        start_btn: "Начать",
        modal_phone_title: "Войти",
        modal_phone_desc: "Введите номер телефона, чтобы войти или зарегистрироваться",
        lbl_phone: "Телефон",
        btn_get_code: "Получить код",
        modal_code_title: "Подтверждение",
        modal_code_desc: "Мы отправили код на",
        lbl_code: "Код из СМС",
        btn_confirm: "Подтвердить",
        btn_resend: "Отправить код снова"
      }
    };

    function setLanguage(lang) {
      // 1. Меняем визуал кнопок
      document.querySelectorAll(".lang-pill").forEach(pill => {
        pill.classList.toggle("active", pill.dataset.lang === lang);
      });

      // 2. Меняем текст на странице
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        el.innerHTML = translations[lang][key];
      });

      // 3. Сохраняем в память
      localStorage.setItem("lang", lang);
      document.documentElement.lang = (lang === "ru" ? "ru" : "kk");

      // 4. (Для ссылки "Бастау" теперь мы просто храним язык, link обновлять необязательно, 
      // так как мы перехватываем клик. Но оставим для fallback)
      const startLink = document.getElementById("startLink");
      startLink.href = "home.html?lang=" + lang;
    }

    // --- Modal Logic ---
    const modal = document.getElementById('smsModal');
    const stepPhone = document.getElementById('stepPhone');
    const stepCode = document.getElementById('stepCode');
    const phoneInput = document.getElementById('phoneInput');
    const codeInput = document.getElementById('codeInput');
    const displayPhone = document.getElementById('displayPhone');

    function openModal(e) {
      if (e) e.preventDefault();
      modal.classList.add('active');
      // Reset to step 1
      stepPhone.classList.add('active');
      stepCode.classList.remove('active');
      phoneInput.focus();
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    function sendCode() {
      const phone = phoneInput.value;
      if (phone.length < 10) {
        alert("Пожалуйста, введите корректный номер");
        return;
      }

      // Imitation of sending code
      displayPhone.textContent = phone;

      stepPhone.classList.remove('active');
      stepCode.classList.add('active');
      codeInput.value = '';
      codeInput.focus();
    }

    function verifyCode() {
      const code = codeInput.value;
      if (code.length !== 4) {
        alert("Код должен состоять из 4 цифр");
        return;
      }

      // Success! Redirect to ONBOARDING
      const lang = localStorage.getItem("lang") || "kz";
      // We can pass the phone to onboarding if needed
      const phone = phoneInput.value;
      window.location.href = "onboarding.html?lang=" + lang + "&phone=" + encodeURIComponent(phone);
    }

    // Intercept "Start" click
    document.getElementById('startLink').addEventListener('click', openModal);

    // Close on overlay click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Слушатели кликов
    document.querySelectorAll(".lang-pill").forEach(pill => {
      pill.addEventListener("click", () => setLanguage(pill.dataset.lang));
    });

    // При загрузке страницы
    const saved = localStorage.getItem("lang") || "kz";
    setLanguage(saved === "ru" ? "ru" : "kz");
  </script>
</body>

</html>
