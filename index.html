<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sheber.kz | Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* 1. БАЗА */
    *:focus { outline: none !important; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Montserrat', sans-serif; background: var(--bg-main); color: var(--text-main); overflow-x: hidden; }

    /* --- VARIABLES --- */
    :root {
      --accent-green: #00f2a0;
      --accent-blue: #00c9ff;
      --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      
      --bg-img-desktop: url('/images/background-desktop.png'); 
      --bg-img-mobile: url('/images/background-mobile.png');
    }

    /* DARK THEME */
    [data-theme="dark"] {
      --bg-main: #010a1a;
      --bg-overlay: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.8));
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.1);
      
      --card-bg: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
      
      --menu-bg: #0b1426;
      --sidebar-border: rgba(255,255,255,0.1);
      
      /* Переключатели */
      --switcher-bg: rgba(255, 255, 255, 0.08);
      --switcher-active-bg: rgba(255, 255, 255, 0.2);
      --switcher-active-text: #ffffff;
      
      --accent-gradient: linear-gradient(135deg, #00f2a0 0%, #00c9ff 100%);
      --accent-text-color: #010a1a;
    }

    /* LIGHT THEME */
    [data-theme="light"] {
      --bg-img-desktop: url('/images/background-desktop-white.png'); 
      --bg-img-mobile: url('/images/background-mobile-white.png');

      --bg-main: #f0f4f8;
      --bg-overlay: linear-gradient(to bottom, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.9));
      --text-main: #1a202c;
      --text-dim: #4a5568;
      
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.6);
      
      --card-bg: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.6) 100%);

      --menu-bg: #ffffff;
      --sidebar-border: rgba(0,0,0,0.1);
      
      /* Переключатели */
      --switcher-bg: rgba(0, 0, 0, 0.05);
      --switcher-active-bg: #ffffff;
      --switcher-active-text: #1a202c;

      --accent-gradient: linear-gradient(135deg, #00f2a0 0%, #00c9ff 100%);
      --accent-text-color: #010a1a;
    }

    /* --- КОНТЕЙНЕР --- */
    .app-container {
      min-height: 100vh;
      position: relative;
      background-image: var(--bg-img-desktop);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 0;
      transition: background-image 0.3s ease;
    }
    .app-container::before {
      content: ""; position: absolute; inset: 0;
      background: var(--bg-overlay);
      z-index: 0; pointer-events: none;
    }
    @media (max-width: 768px) { .app-container { background-image: var(--bg-img-mobile); } }

    /* ОСНОВНОЙ КОНТЕНТ */
    .main-content {
        position: relative; z-index: 2;
        padding: 16px 20px;
        max-width: 600px; margin: 0 auto;
        padding-bottom: 100px;
    }

    /* --- 1. HEADER --- */
    .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 0 24px 0;
    }
    .icon-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative; backdrop-filter: blur(10px);
    }
    .icon-btn svg { width: 24px; height: 24px; fill: var(--text-main); }
    
    .notification-dot {
        position: absolute; top: 10px; right: 10px;
        width: 8px; height: 8px; background: #ff4757;
        border-radius: 50%; border: 1px solid var(--menu-bg);
    }

    .address-selector {
        display: flex; flex-direction: column; align-items: center; cursor: pointer;
    }
    .addr-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
    .addr-val { 
        font-size: 14px; font-weight: 600; color: var(--text-main); 
        display: flex; align-items: center; gap: 4px; 
        max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .addr-val svg { width: 12px; height: 12px; fill: var(--accent-green); }

    /* --- 2. SERVICE GRID --- */
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text-main); }

    .service-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 30px;
    }
    .service-card {
        background: var(--card-bg); border: 1px solid var(--glass-border);
        border-radius: 20px; padding: 16px 8px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        backdrop-filter: blur(10px); cursor: pointer; transition: 0.2s; aspect-ratio: 1 / 1;
    }
    .service-card:active { transform: scale(0.96); }
    .service-icon { width: 40px; height: 40px; object-fit: contain; }
    [data-theme="dark"] .service-icon { filter: invert(1) brightness(1.5); }
    .service-name { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2; }

    /* --- 3. QUICK REQUEST --- */
    .quick-request-card {
        background: var(--card-bg); border: 1px solid var(--glass-border);
        border-radius: 24px; padding: 24px; text-align: center;
        backdrop-filter: blur(12px); margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .quick-btn {
        background: var(--accent-gradient); width: 100%; border: none; padding: 18px;
        border-radius: 16px; font-size: 16px; font-weight: 800; text-transform: uppercase;
        color: var(--accent-text-color); box-shadow: 0 10px 20px rgba(0, 242, 160, 0.3);
        cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: 0.3s;
    }
    .quick-btn:active { transform: scale(0.98); }
    .quick-desc { font-size: 13px; color: var(--text-dim); }

    /* --- 4. ACTIVE ORDERS --- */
    .active-order-card {
        background: rgba(0, 242, 160, 0.1); border: 1px solid var(--accent-green);
        border-radius: 20px; padding: 20px; display: flex; justify-content: space-between; align-items: center;
        backdrop-filter: blur(10px);
    }
    .order-info { display: flex; flex-direction: column; gap: 4px; }
    .order-label { font-size: 11px; color: var(--accent-green); font-weight: 700; text-transform: uppercase; }
    .order-status { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .order-sub { font-size: 12px; color: var(--text-dim); }
    .order-btn {
        background: var(--glass-bg); border: 1px solid var(--glass-border);
        width: 40px; height: 40px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center; color: var(--text-main);
    }

    /* --- SIDEBAR (MENU) --- */
    .sidebar-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.6);
        z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s;
        backdrop-filter: blur(4px);
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }

    .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 280px; background: var(--menu-bg);
        z-index: 101; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        padding: 40px 24px; display: flex; flex-direction: column;
        border-right: 1px solid var(--sidebar-border);
        box-shadow: 10px 0 30px rgba(0,0,0,0.1);
    }
    .sidebar.active { transform: translateX(0); }

    .user-profile {
        display: flex; align-items: center; gap: 12px; margin-bottom: 40px;
    }
    .avatar {
        width: 50px; height: 50px; border-radius: 50%;
        background: var(--glass-bg); border: 2px solid var(--accent-green);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 700; color: var(--text-main);
    }
    .user-info .name { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .user-info .phone { font-size: 12px; color: var(--text-dim); }

    .menu-list { list-style: none; padding: 0; margin: 0; flex: 1; }
    .menu-item {
        padding: 16px 0; border-bottom: 1px solid var(--glass-border);
        color: var(--text-main); font-size: 16px; font-weight: 500;
        cursor: pointer; display: flex; align-items: center; gap: 12px;
        transition: 0.2s;
    }
    .menu-item:active { opacity: 0.7; transform: translateX(5px); }
    .menu-item svg { width: 20px; height: 20px; fill: var(--text-dim); }

    /* --- SIDEBAR FOOTER & SWITCHERS --- */
    .menu-footer {
        margin-top: auto;
        padding-top: 20px;
        display: flex; flex-direction: column; gap: 20px;
    }

    /* 1. Language Switcher (Glider Style) */
    .lang-rect {
        display: flex; position: relative;
        padding: 4px; background: var(--switcher-bg);
        border: 1px solid var(--glass-border); border-radius: 100px;
        overflow: hidden;
    }
    .lang-pill { 
        flex: 1; text-align: center; position: relative; z-index: 2; padding: 10px 0;
        border-radius: 100px; font-size: 13px; font-weight: 700; 
        cursor: pointer; color: var(--text-dim); text-transform: uppercase;
        transition: color 0.3s ease;
    }
    .lang-pill.active { color: var(--switcher-active-text); }
    
    .glider {
        position: absolute; top: 4px; left: 4px; bottom: 4px;
        /* Ширина задается JS */
        background: var(--switcher-active-bg); border-radius: 100px; z-index: 1;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    [data-theme="light"] .glider { border: 1px solid rgba(0,0,0,0.05); }

    /* 2. Theme Toggle (iOS Style) */
    .theme-switch-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 4px;
    }
    .theme-label { font-size: 14px; font-weight: 600; color: var(--text-main); }

    .toggle-switch {
        position: relative; display: inline-block;
        width: 52px; height: 30px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    
    .slider {
        position: absolute; cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: var(--switcher-bg);
        border: 1px solid var(--glass-border);
        transition: .4s; border-radius: 34px;
    }
    .slider:before {
        position: absolute; content: "";
        height: 24px; width: 24px;
        left: 2px; bottom: 2px;
        background-color: #fff;
        transition: .4s; border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    /* Active State (Green Accent) */
    input:checked + .slider {
        background-color: var(--accent-green);
        border-color: var(--accent-green);
    }
    input:checked + .slider:before {
        transform: translateX(22px);
    }

  </style>
</head>

<body>
  <div class="app-container">
    
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">

        </div>
        
        <ul class="menu-list">

                Профиль
            </li>
            <li class="menu-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                История заказов
            </li>
            <li class="menu-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Настройки
            </li>
            <li class="menu-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
                Помощь
            </li>
        </ul>

        <div class="menu-footer">
            <div class="lang-rect" id="sidebarLangRect">
                <div class="glider"></div>
                <div class="lang-pill active" data-lang="kz" onclick="setLanguage('kz')">Қазақ тілі</div>
                <div class="lang-pill" data-lang="ru" onclick="setLanguage('ru')">Русский</div>
            </div>

            <div class="theme-switch-row">
                <span class="theme-label">Түнгі режим</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="themeCheckbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="main-content">
        <header class="header">
            <button class="icon-btn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>

            <div class="address-selector" onclick="changeAddress()">
                <div class="addr-label">Мекенжай</div>
                <div class="addr-val">
                    Астана, Көктал-1... 
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                </div>
            </div>

            <button class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                <div class="notification-dot"></div>
            </button>
        </header>

        <div class="section-title">Қызметтер</div>

            <div class="service-card">

                <div class="service-name">Электрик</div>
            </div>
            <div class="service-card">
                <img src="https://cdn-icons-png.flaticon.com/128/7583/7583177.png" class="service-icon" alt="Plumb">
                <div class="service-name">Сантехник</div>
            </div>
            <div class="service-card">
                <img src="https://cdn-icons-png.flaticon.com/128/4479/4479614.png" class="service-icon" alt="Repair">
                <div class="service-name">Ремонт</div>
            </div>
            <div class="service-card">
                <img src="https://cdn-icons-png.flaticon.com/128/6656/6656767.png" class="service-icon" alt="Garden">
                <div class="service-name">Аула</div>
            </div>
            <div class="service-card">
                <img src="https://cdn-icons-png.flaticon.com/128/3050/3050809.png" class="service-icon" alt="Clean">
                <div class="service-name">Тазалық</div>
            </div>
            <div class="service-card">
                <img src="https://cdn-icons-png.flaticon.com/128/3018/3018447.png" class="service-icon" alt="All">
                <div class="service-name">Барлығы</div>
            </div>
        </div>

        <div class="quick-request-card">
            <button class="quick-btn">
                Бағасын өзің қой!
                <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
            </button>
            <div class="quick-desc">Мамандар 5 минутта жауап береді</div>
        </div>

        <div class="section-title">Активный заказ</div>
        <div class="active-order-card">
            <div class="order-info">
                <div class="order-label">В работе</div>
                <div class="order-status">Мастер в пути</div>
                <div class="order-sub">Сантехника • Через 15 мин</div>
            </div>
            <div class="order-btn">
                <svg viewBox="0 0 24 24" style="width:24px; height:24px; fill:currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </div>
        </div>
    </div>
  </div>

  <script>
    // --- 1. THEME LOGIC ---
    const themeCheckbox = document.getElementById('themeCheckbox');
    
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      themeCheckbox.checked = (theme === 'dark'); 
    }

    themeCheckbox.addEventListener('change', (e) => {
        setTheme(e.target.checked ? 'dark' : 'light');
    });

    // Init Theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);


    // --- 2. LANGUAGE LOGIC (GLIDER) ---
    function setLanguage(lang) {
        // Убираем active у всех
        document.querySelectorAll(".lang-pill").forEach(p => p.classList.remove("active"));
        
        // Находим выбранные кнопки (по data-lang)
        const activePills = document.querySelectorAll(`.lang-pill[data-lang="${lang}"]`);
        
        activePills.forEach(p => {
            p.classList.add("active");
            
            // Двигаем глайдер
            const parent = p.closest('.lang-rect');
            const glider = parent.querySelector('.glider');
            if (glider) {
                glider.style.width = `${p.offsetWidth}px`;
                glider.style.transform = `translateX(${p.offsetLeft - 4}px)`; // -4 padding
            }
        });
        
        localStorage.setItem("lang", lang);
    }

    // Init Language
    window.addEventListener('load', () => {
        setLanguage(localStorage.getItem("lang") || "kz");
    });


    // --- 3. MENU LOGIC ---
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
        
        // Пересчет глайдера при открытии меню (чтобы ширина была корректной)
        setTimeout(() => {
            const currentLang = localStorage.getItem("lang") || "kz";
            setLanguage(currentLang);
        }, 50);
    }

    function changeAddress() {
        alert("Здесь откроется выбор адреса");
    }
  </script>
</body>
</html>
