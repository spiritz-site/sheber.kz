<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumys.online | Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Steps */
        .step {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 10px;
            color: #172343;
        }

        p {
            color: #64748b;
            font-size: 15px;
            margin: 0 0 30px;
            line-height: 1.5;
        }

        /* Role Layout */
        .role-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .role-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
        }

        .role-card:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .role-card.selected {
            border-color: #00205b;
            background: #eff6ff;
        }

        .role-title {
            font-size: 18px;
            font-weight: 700;
            color: #172343;
            margin-bottom: 4px;
        }

        .role-desc {
            font-size: 13px;
            color: #64748b;
        }

        .role-icon {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 24px;
        }

        .btn-next {
            background: #00205b;
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            margin-top: 30px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-next:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-next:hover:not(:disabled) {
            background: #001640;
        }

        /* Form Layout */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .text-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: #00205b;
        }

        /* Back Button */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Step 1: Role Selection -->
        <div id="stepRole" class="step active">
            <h1 data-i18n="role_title">Кто вы?</h1>
            <p data-i18n="role_desc">Выберите роль, чтобы мы настроили интерфейс под вас</p>

            <div class="role-cards">
                <div class="role-card" onclick="selectRole('master', this)">
                    <div class="role-title" data-i18n="role_master">Я Мастер</div>
                    <div class="role-desc" data-i18n="role_master_desc">Ищу заказы и работу</div>
                    <div class="role-icon">🛠️</div>
                </div>

                <div class="role-card" onclick="selectRole('client', this)">
                    <div class="role-title" data-i18n="role_client">Я Клиент</div>
                    <div class="role-desc" data-i18n="role_client_desc">Ищу мастера для задачи</div>
                    <div class="role-icon">🏠</div>
                </div>
            </div>

            <button id="btnRoleNext" class="btn-next" disabled onclick="nextStep()"
                data-i18n="btn_next">Продолжить</button>
        </div>

        <!-- Step 2: Profile Info -->
        <div id="stepProfile" class="step">
            <button class="btn-back" onclick="prevStep()">&larr;</button>
            <h1 data-i18n="profile_title">Ваш профиль</h1>
            <p data-i18n="profile_desc">Расскажите немного о себе</p>

            <div class="input-group">
                <label class="input-label" data-i18n="lbl_name">Имя</label>
                <input type="text" class="text-input" id="inputName" placeholder="Асқар">
            </div>

            <div class="input-group">
                <label class="input-label" data-i18n="lbl_city">Город</label>
                <select class="text-input" id="inputCity">
                    <option value="Kyzylorda">Кызылорда</option>
                    <option value="Almaty">Алматы</option>
                    <option value="Astana">Астана</option>
                    <option value="Shymkent">Шымкент</option>
                </select>
            </div>

            <button class="btn-next" onclick="finishOnboarding()" data-i18n="btn_finish">Начать</button>
        </div>

    </div>

    <script>
        const translations = {
            kz: {
                role_title: "Сіз кімсіз?",
                role_desc: "Интерфейсті сізге ыңғайластыру үшін рөлді таңдаңыз",
                role_master: "Мен Шебермін",
                role_master_desc: "Тапсырыс және жұмыс іздеймін",
                role_client: "Мен Тапсырысшымын",
                role_client_desc: "Шаруама шебер іздеймін",
                btn_next: "Жалғастыру",
                profile_title: "Профиль",
                profile_desc: "Өзіңіз туралы қысқаша айтып беріңіз",
                lbl_name: "Есіміңіз",
                lbl_city: "Қала",
                btn_finish: "Бастау"
            },
            ru: {
                role_title: "Кто вы?",
                role_desc: "Выберите роль, чтобы мы настроили интерфейс под вас",
                role_master: "Я Мастер",
                role_master_desc: "Ищу заказы и работу",
                role_client: "Я Клиент",
                role_client_desc: "Ищу мастера для задачи",
                btn_next: "Продолжить",
                profile_title: "Ваш профиль",
                profile_desc: "Расскажите немного о себе",
                lbl_name: "Имя",
                lbl_city: "Город",
                btn_finish: "Начать"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || localStorage.getItem('lang') || 'kz';
        const phone = urlParams.get('phone');

        // Apply translations
        document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
        const t = translations[lang] || translations.kz;

        for (const key in t) {
            const el = document.querySelector(`[data-i18n="${key}"]`);
            if (el) el.textContent = t[key];
        }

        let selectedRole = null;

        function selectRole(role, card) {
            selectedRole = role;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('btnRoleNext').disabled = false;
        }

        function nextStep() {
            document.getElementById('stepRole').classList.remove('active');
            document.getElementById('stepProfile').classList.add('active');
        }

        function prevStep() {
            document.getElementById('stepProfile').classList.remove('active');
            document.getElementById('stepRole').classList.add('active');
        }

        function finishOnboarding() {
            const name = document.getElementById('inputName').value.trim();
            const city = document.getElementById('inputCity').value;

            if (!name) {
                alert(lang === 'ru' ? 'Введите имя' : 'Есіміңізді енгізіңіз');
                return;
            }

            // Save User Data
            const user = {
                phone: phone,
                role: selectedRole,
                name: name,
                city: city,
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('user', JSON.stringify(user));

            // Redirect to Home
            window.location.href = `home.html?lang=${lang}`;
        }
    </script>
</body>

</html>
